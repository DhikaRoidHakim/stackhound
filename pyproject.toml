[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stackhound"
dynamic = ["version"]
description = "Framework-Based Security Configuration & CVE Auditor (non-intrusive)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DhikaRoidHakim" }]
keywords = ["security", "audit", "cve", "laravel", "fingerprint", "osv", "nvd"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "rich>=13.7",
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "platformdirs>=4.0",
    "packaging>=24.0",
    "cvss>=3.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
shound = "shound.cli:app"

[tool.hatch.version]
path = "shound/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["shound"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
# User-facing text is Indonesian and may legitimately contain en dashes etc.
ignore = ["RUF001", "RUF002", "RUF003"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["shound"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = [
    "live: test that calls real external APIs (NVD/OSV); run explicitly with -m live",
]
