# Single-page-app style server: every path returns index.html with 200.
# Used to prove that path checks produce zero false positives (soft-404).
#
# It also carries a classic CORS misconfiguration for SH-03: any Origin,
# including "null", is reflected together with Allow-Credentials: true.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        try_files $uri /index.html;
    }
}
